# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen       80;
        listen       [::]:80;
        server_name  localhost;
        # root         /usr/share/nginx/html;

        ######### react-low-code #############
        location /react-low-code {
          alias  /usr/share/nginx/html/react-low-code/build/;
          index index.html;
          try_files $uri $uri/ /react-low-code/index.html;
        }

        # API proxy configuration
        location /api {
          # 所有以 /api 开头的请求都会匹配这个位置块
          proxy_pass http://localhost:8000;
          # 将请求转发到 localhost 服务的 8000 端口
          proxy_http_version 1.1;
          # 使用 HTTP/1.1 协议进行代理
          # HTTP/1.1 支持长连接，这对 WebSocket 等长连接场景很重要
          proxy_set_header Upgrade $http_upgrade;
          # 转发 Upgrade 头信息，用于支持 WebSocket 连接
          # 当客户端请求升级协议（如切换到 WebSocket）时需要这个头部
          proxy_set_header Connection 'upgrade';
          # 配合 Upgrade 头，指定 Connection 为 'upgrade'
          # 告诉服务器这是一个协议升级请求
          proxy_set_header Host $host;
          # 设置 Host 头为原始请求的 host
          # 确保后端服务器知道请求的原始主机名
          # $host 变量包含原始请求的主机名
          proxy_cache_bypass $http_upgrade;
          # 当有协议升级请求时绕过缓存
          # 确保 WebSocket 等动态连接不会被缓存
        }
        ######### end-react-low-code #############

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }

